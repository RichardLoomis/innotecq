<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xenovia console — Veldhoff Logistics demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ── Tokens: sampled from app.xenovia.io ───────────────────────── */
  :root {
    --bg: #0a0e15;
    --bg-elevated: #0e131c;
    --panel: #121824;
    --panel-2: #161d2b;
    --line: rgba(255,255,255,0.07);
    --line-2: rgba(255,255,255,0.11);
    --text: #eef1f5;
    --text-2: #9aa3ae;
    --text-3: #626c7a;
    --teal: #3bb9ac;
    --teal-hi: #4fcabd;
    --teal-ink: #052723;
    --teal-glow: rgba(59,185,172,0.15);
    --amber: #e0973b;
    --amber-hi: #efac52;
    --amber-ink: #241704;
    --danger: #ff7a76;
    --danger-bg: #241416;
    --danger-line: #b8433d;
    /* live accent, flipped by [data-regime] */
    --accent: var(--teal);
    --accent-hi: var(--teal-hi);
    --accent-ink: var(--teal-ink);
    --accent-glow: var(--teal-glow);
    --sans: "Inter", system-ui, -apple-system, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  body[data-regime="ungoverned"] {
    --accent: var(--amber);
    --accent-hi: var(--amber-hi);
    --accent-ink: var(--amber-ink);
    --accent-glow: rgba(224,151,59,0.14);
  }

  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--sans); font-size: 15px; line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; cursor: pointer; color: inherit; }
  ::placeholder { color: var(--text-3); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 6px; border: 2px solid var(--bg); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .shell { display: flex; height: 100dvh; }

  /* ── Sidebar ───────────────────────────────────────────────────── */
  .sidebar {
    width: 272px; flex: none; display: flex; flex-direction: column;
    background: var(--bg); border-right: 1px solid var(--line); padding: 16px 12px;
  }
  .brand { display: flex; align-items: center; gap: 9px; padding: 6px 8px 16px; }
  .brand .mark { width: 16px; height: 16px; border-radius: 5px; background: var(--teal); box-shadow: 0 0 14px var(--teal-glow); }
  .brand .name { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
  .brand .name span { color: var(--text-3); font-weight: 500; }

  .side-label { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-3); padding: 6px 10px; }

  .agent-item {
    display: flex; align-items: center; gap: 11px; width: 100%; text-align: left;
    background: transparent; border: 0; border-radius: 10px; padding: 9px 10px; margin-bottom: 2px;
    transition: background 120ms ease;
  }
  .agent-item:hover { background: rgba(255,255,255,0.04); }
  .agent-item[aria-current="true"] { background: rgba(255,255,255,0.06); }
  .agent-item .tile {
    flex: none; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 8px;
    background: var(--panel); color: var(--text-2); border: 1px solid var(--line);
    font-family: var(--mono); font-size: 11px; font-weight: 500;
  }
  .agent-item[aria-current="true"] .tile { background: var(--teal); color: var(--teal-ink); border-color: transparent; box-shadow: 0 0 14px var(--teal-glow); }
  .agent-item .meta { min-width: 0; flex: 1; }
  .agent-item .name { font-size: 14px; font-weight: 500; color: var(--text); line-height: 1.3; }
  .agent-item .ep { font-size: 12px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .agent-item .count {
    flex: none; font-size: 11px; font-weight: 600; font-family: var(--mono);
    background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger-line);
    padding: 1px 7px; border-radius: 999px;
  }
  .sidebar-foot { margin-top: auto; padding: 10px 10px 2px; font-size: 11.5px; color: var(--text-3); border-top: 1px solid var(--line); }
  .sidebar-foot b { color: var(--text-2); font-weight: 600; }

  /* ── Chat column ───────────────────────────────────────────────── */
  .chat { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg); }

  .topbar { display: flex; align-items: center; gap: 14px; padding: 14px 22px; border-bottom: 1px solid var(--line); }
  .topbar .title { min-width: 0; }
  .topbar h1 { margin: 0; font-size: 15.5px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar .ep { color: var(--text-3); font-weight: 400; }
  .topbar .spacer { flex: 1; }

  /* regime segmented control */
  .regime { display: flex; gap: 3px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  .regime button {
    display: flex; align-items: center; gap: 7px; border: 0; background: transparent;
    color: var(--text-2); padding: 5px 13px; border-radius: 999px; font-size: 12.5px; font-weight: 500;
    transition: background 140ms ease, color 140ms ease;
  }
  .regime .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); }
  .regime button[aria-pressed="true"] { color: var(--text); }
  .regime button[aria-pressed="true"].r-gov { background: rgba(59,185,172,0.16); color: var(--teal-hi); }
  .regime button[aria-pressed="true"].r-gov .dot { background: var(--teal); box-shadow: 0 0 8px var(--teal); }
  .regime button[aria-pressed="true"].r-ungov { background: rgba(224,151,59,0.16); color: var(--amber-hi); }
  .regime button[aria-pressed="true"].r-ungov .dot { background: var(--amber); box-shadow: 0 0 8px var(--amber); }
  .regime button:disabled { opacity: 0.4; cursor: not-allowed; }

  .reset { border: 0; background: transparent; color: var(--text-3); padding: 6px 8px; border-radius: 8px; font-size: 13px; }
  .reset:hover { color: var(--text); background: rgba(255,255,255,0.05); }

  .substatus { padding: 7px 22px; font-size: 12px; color: var(--text-3); border-bottom: 1px solid var(--line); background: var(--bg-elevated); }
  .substatus b { color: var(--accent); font-weight: 600; }

  /* stage holds either the empty-state hero or the message thread */
  .stage { flex: 1; min-height: 0; position: relative; }
  .threads { position: absolute; inset: 0; overflow-y: auto; }
  .thread { display: none; padding: 26px 22px 28px; }
  .thread.active { display: block; }
  .thread-inner { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

  /* empty-state hero */
  .hero {
    position: absolute; inset: 0; z-index: 2; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; gap: 22px;
  }
  .hero[hidden] { display: none; }
  .hero-head { text-align: center; }
  .hero h2 { margin: 0; font-size: 27px; font-weight: 600; letter-spacing: -0.02em; }
  .hero p { margin: 8px auto 0; font-size: 14.5px; color: var(--text-2); max-width: 46ch; }
  .hero-slot { width: 100%; max-width: 720px; }
  .chips { display: flex; flex-wrap: wrap; gap: 9px; justify-content: center; max-width: 720px; }
  .chip {
    background: transparent; border: 1px solid var(--line-2); color: var(--text-2);
    padding: 8px 15px; border-radius: 999px; font-size: 13px; transition: all 120ms ease;
  }
  .chip:hover { border-color: var(--accent); color: var(--text); background: var(--accent-glow); }

  /* messages */
  .msg-user {
    align-self: flex-end; max-width: 80%; background: var(--panel-2); color: var(--text);
    padding: 11px 16px; border-radius: 16px 16px 4px 16px; border: 1px solid var(--line);
    white-space: pre-wrap; word-break: break-word;
  }
  .msg-agent { max-width: 70ch; color: var(--text); white-space: pre-wrap; word-break: break-word; padding: 0 2px; }
  .msg-agent.interim { color: var(--text-2); }

  /* tool activity — quiet panel, one grouped block per turn */
  .activity {
    background: var(--bg-elevated); border: 1px solid var(--line); border-left: 2px solid var(--accent);
    border-radius: 10px; padding: 11px 14px; font-family: var(--mono); font-size: 12px; line-height: 1.7;
    word-break: break-word;
  }
  .activity.gov { border-left-color: var(--teal); }
  .activity.ungov { border-left-color: var(--amber); }
  .activity .call { color: var(--text); font-weight: 500; }
  .activity.gov .call b { color: var(--teal-hi); font-weight: 500; }
  .activity.ungov .call b { color: var(--amber-hi); font-weight: 500; }
  .activity .res { color: var(--text-3); padding-left: 15px; }
  .activity .res.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
  .activity .res.clamp:hover { color: var(--text-2); }
  .activity .err { color: var(--danger); }

  /* incidents — the one place red appears */
  .incident {
    display: flex; gap: 11px; align-items: flex-start;
    background: var(--danger-bg); border: 1px solid var(--danger-line); border-left-width: 3px;
    border-radius: 10px; padding: 11px 14px; color: var(--danger); font-size: 14px; font-weight: 500;
  }
  .incident svg { flex: none; margin-top: 3px; }
  .sysnote { font-size: 12.5px; color: var(--text-3); max-width: 62ch; padding: 0 2px; }

  .thinking { display: inline-flex; gap: 5px; padding: 6px 2px; }
  .thinking i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); opacity: 0.5; }
  @media (prefers-reduced-motion: no-preference) {
    .thinking i { animation: blink 1.3s infinite; }
    .thinking i:nth-child(2) { animation-delay: 0.18s; }
    .thinking i:nth-child(3) { animation-delay: 0.36s; }
    @keyframes blink { 0%,70%,100% { opacity: 0.25; } 35% { opacity: 1; } }
    .send, .regime button, .chip { transition: all 140ms ease; }
  }

  /* ── Composer (moves between hero and dock) ────────────────────── */
  .dock { padding: 14px 22px 18px; }
  .dock[hidden] { display: none; }
  .composer-wrap { max-width: 760px; margin: 0 auto; }
  .composer {
    display: flex; align-items: flex-end; gap: 8px;
    background: var(--panel); border: 1px solid var(--line-2); border-radius: 16px;
    padding: 9px 9px 9px 18px; transition: border-color 140ms ease, box-shadow 140ms ease;
  }
  .composer:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
  .composer textarea {
    flex: 1; border: 0; resize: none; background: transparent; color: var(--text);
    font: inherit; font-size: 15px; line-height: 1.5; max-height: 168px; padding: 6px 0;
  }
  .composer textarea:focus { outline: none; }
  .composer textarea:disabled { color: var(--text-3); }
  .send {
    flex: none; width: 34px; height: 34px; border: 0; border-radius: 50%;
    background: var(--accent); color: var(--accent-ink); display: grid; place-items: center;
  }
  .send:hover:enabled { background: var(--accent-hi); }
  .send:disabled { background: var(--panel-2); color: var(--text-3); cursor: not-allowed; }
  .composer-hint { max-width: 760px; margin: 9px auto 0; text-align: center; font-size: 11.5px; color: var(--text-3); }

  /* ── Access gate ───────────────────────────────────────────────── */
  .gate { margin: auto; max-width: 400px; width: 100%; background: var(--panel); border: 1px solid var(--line-2); border-radius: 16px; padding: 28px; }
  .gate h2 { margin: 0 0 6px; font-size: 19px; }
  .gate p { margin: 0 0 16px; color: var(--text-2); font-size: 14px; }
  .gate form { display: flex; gap: 8px; }
  .gate input { flex: 1; border: 1px solid var(--line-2); background: var(--bg); color: var(--text); padding: 9px 12px; border-radius: 10px; font: inherit; font-size: 14px; }
  .gate button { border: 0; background: var(--teal); color: var(--teal-ink); padding: 9px 18px; border-radius: 10px; font-weight: 600; }
  .gate .bad { color: var(--danger); font-size: 13px; margin-top: 10px; }

  /* ── Mobile ────────────────────────────────────────────────────── */
  @media (max-width: 840px) {
    .shell { flex-direction: column; }
    .sidebar {
      width: 100%; flex-direction: row; align-items: center; gap: 4px; overflow-x: auto;
      padding: 8px 10px; border-right: 0; border-bottom: 1px solid var(--line);
    }
    .brand, .side-label, .sidebar-foot { display: none; }
    .agent-item { flex: none; width: auto; }
    .agent-item .ep { display: none; }
    .topbar { padding: 12px 16px; flex-wrap: wrap; }
    .substatus, .thread, .dock { padding-left: 16px; padding-right: 16px; }
    .hero h2 { font-size: 22px; }
    .msg-user { max-width: 92%; }
  }
</style>
</head>
<body data-regime="governed">
<div class="shell" id="shell" hidden>
  <nav class="sidebar">
    <div class="brand"><span class="mark"></span><span class="name">Xenovia<span> · console</span></span></div>
    <div class="side-label">Agents</div>
    <div id="agent-list"></div>
    <div class="sidebar-foot" id="side-foot"></div>
  </nav>

  <main class="chat">
    <div class="topbar">
      <div class="title"><h1 id="tb-title"></h1></div>
      <div class="spacer"></div>
      <div class="regime" role="group" aria-label="Governance regime">
        <button class="r-ungov" id="mode-ungoverned" aria-pressed="false"><span class="dot"></span>Ungoverned</button>
        <button class="r-gov" id="mode-governed" aria-pressed="true"><span class="dot"></span>Governed</button>
      </div>
      <button class="reset" id="reset-btn">Reset</button>
    </div>
    <div class="substatus" id="substatus"></div>

    <div class="stage">
      <div class="threads" id="threads"></div>
      <div class="hero" id="hero" hidden>
        <div class="hero-head">
          <h2 id="hero-title"></h2>
          <p id="hero-sub"></p>
        </div>
        <div class="hero-slot" id="hero-slot"></div>
        <div class="chips" id="hero-chips"></div>
      </div>
    </div>

    <div class="dock" id="dock" hidden></div>
  </main>
</div>

<!-- single composer, moved between hero-slot and dock -->
<template id="composer-tpl">
  <div class="composer-wrap">
    <div class="composer">
      <textarea id="input" rows="1" placeholder="How can I help you today?" aria-label="Message the agent"></textarea>
      <button class="send" id="send" aria-label="Send">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
      </button>
    </div>
    <div class="composer-hint" id="composer-hint"></div>
  </div>
</template>

<div id="gate" class="gate" hidden>
  <h2>Access key required</h2>
  <p>This console starts live agent conversations. Enter the demo access key to continue.</p>
  <form id="gate-form">
    <input id="gate-input" type="password" autocomplete="off" aria-label="Demo access key">
    <button type="submit">Unlock</button>
  </form>
  <div class="bad" id="gate-bad" hidden>That key was not accepted.</div>
</div>

<script>
const CODES = { ap: "AP", helpdesk: "IT", support: "CS", reporting: "DR" };
const GREETING = {
  ap: "Ready to work the invoice queue.",
  helpdesk: "Ready to work the IT queue.",
  support: "Ready to work the support queue.",
  reporting: "Ready for your reporting request.",
};
const state = { roster: null, mode: "governed", current: null, threads: {} };

function demoKey() { try { return localStorage.getItem("xenovia-demo-key") || ""; } catch { return ""; } }
function saveKey(k) { try { localStorage.setItem("xenovia-demo-key", k); } catch {} }
function headers() {
  const h = { "content-type": "application/json" };
  const k = demoKey();
  if (k) h["x-demo-key"] = k;
  return h;
}
function el(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n; }
function host(url) { try { return new URL(url).host; } catch { return url; } }
function splitTitle(t) { const p = t.split(" — "); return { name: p[0].replace(" agent", ""), episode: p[1] || "" }; }
function regimeClass() { return state.mode === "governed" ? "gov" : "ungov"; }

// composer element built once from the template
const composer = document.getElementById("composer-tpl").content.firstElementChild.cloneNode(true);
const input = composer.querySelector("#input");
const sendBtn = composer.querySelector("#send");
const composerHint = composer.querySelector("#composer-hint");

async function init() {
  const res = await fetch("/api/agents", { headers: headers() });
  state.roster = await res.json();
  const gate = document.getElementById("gate");
  const shell = document.getElementById("shell");
  if (state.roster.gated && !state.roster.authorized) { gate.hidden = false; shell.hidden = true; return; }
  gate.hidden = true; shell.hidden = false;
  if (!state.roster.modes.governed && state.roster.modes.ungoverned) state.mode = "ungoverned";
  buildSidebar();
  selectAgent(state.roster.agents[0].key);
  renderMode();
}

document.getElementById("gate-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  saveKey(document.getElementById("gate-input").value.trim());
  await init();
  if (state.roster.gated && !state.roster.authorized) document.getElementById("gate-bad").hidden = false;
});

function buildSidebar() {
  const list = document.getElementById("agent-list");
  const threads = document.getElementById("threads");
  for (const agent of state.roster.agents) {
    const t = splitTitle(agent.title);
    const item = el("button", "agent-item");
    const meta = el("div", "meta");
    meta.append(el("div", "name", t.name), el("div", "ep", t.episode));
    const badge = el("span", "count", "0"); badge.hidden = true;
    item.append(el("span", "tile", CODES[agent.key] || "··"), meta, badge);
    item.addEventListener("click", () => selectAgent(agent.key));
    list.append(item);

    const thread = el("div", "thread");
    const inner = el("div", "thread-inner");
    thread.append(inner);
    threads.append(thread);

    state.threads[agent.key] = { agent, item, badge, thread, inner, session: null, busy: false, started: false, incidents: 0 };
  }
}

function selectAgent(key) {
  state.current = key;
  for (const [k, c] of Object.entries(state.threads)) {
    c.item.setAttribute("aria-current", String(k === key));
    c.thread.classList.toggle("active", k === key);
  }
  const c = state.threads[key];
  const t = splitTitle(c.agent.title);
  const tb = document.getElementById("tb-title");
  tb.textContent = t.name + " ";
  if (t.episode) tb.append(el("span", "ep", t.episode));
  layoutForCurrent();
  input.focus();
}

function layoutForCurrent() {
  const c = state.threads[state.current];
  const hero = document.getElementById("hero");
  const dock = document.getElementById("dock");
  if (c.started) {
    hero.hidden = true;
    document.querySelector(".composer-wrap") && dock.appendChild(composer);
    dock.hidden = false;
  } else {
    const t = splitTitle(c.agent.title);
    document.getElementById("hero-title").textContent = GREETING[c.agent.key] || ("Chat with " + t.name);
    document.getElementById("hero-sub").textContent =
      c.agent.tagline + " The backend is a dummy system seeded with live bait — just ask.";
    const chips = document.getElementById("hero-chips");
    chips.textContent = "";
    for (const s of c.agent.starters) {
      const b = el("button", "chip", s);
      b.addEventListener("click", () => { if (!c.busy) send(c, s); });
      chips.append(b);
    }
    document.getElementById("hero-slot").appendChild(composer);
    hero.hidden = false;
    dock.hidden = true;
  }
  syncComposer();
}

function renderMode() {
  const m = state.roster.modes;
  const bU = document.getElementById("mode-ungoverned");
  const bG = document.getElementById("mode-governed");
  bU.disabled = !m.ungoverned; bG.disabled = !m.governed;
  bU.setAttribute("aria-pressed", String(state.mode === "ungoverned"));
  bG.setAttribute("aria-pressed", String(state.mode === "governed"));
  bU.title = m.ungoverned ? "" : "Set UNGOVERNED_BASE_URL to enable";
  bG.title = m.governed ? "" : "Set XENOVIA_BASE_URL to enable";

  const configured = m[state.mode];
  document.body.dataset.regime = configured ? state.mode : "governed";

  const sub = document.getElementById("substatus");
  if (state.mode === "governed" && m.governed) {
    sub.innerHTML = "Every action is decided by <b>Xenovia</b> — tenant " + host(state.roster.endpoints.governed) + ". Denials and traces appear in your tenant console.";
    composerHint.innerHTML = "Enter to send · Shift+Enter for a new line · replies are live, <b>governed by Xenovia</b>";
  } else if (state.mode === "ungoverned" && m.ungoverned) {
    sub.innerHTML = "No policy layer attached — <b>every action the model requests will execute.</b>";
    composerHint.innerHTML = "Enter to send · Shift+Enter for a new line · replies are live, <b>ungoverned</b>";
  } else {
    sub.textContent = "No endpoint configured. Set XENOVIA_BASE_URL (and optionally UNGOVERNED_BASE_URL) on the service.";
    composerHint.textContent = "Configure an endpoint to start chatting.";
  }
  const foot = document.getElementById("side-foot");
  foot.innerHTML = "Regime: <b>" + (state.mode === "governed" ? "Governed by Xenovia" : "Ungoverned") + "</b>";
  syncComposer();
}
document.getElementById("mode-ungoverned").addEventListener("click", () => { state.mode = "ungoverned"; renderMode(); });
document.getElementById("mode-governed").addEventListener("click", () => { state.mode = "governed"; renderMode(); });
document.getElementById("reset-btn").addEventListener("click", () => resetThread(state.threads[state.current]));

function syncComposer() {
  const c = state.threads[state.current];
  const ok = state.roster.modes[state.mode];
  input.disabled = !ok || (c && c.busy);
  sendBtn.disabled = !ok || (c && c.busy) || !input.value.trim();
  input.placeholder = ok ? "How can I help you today?" : "Configure an endpoint to start chatting";
}

function push(c, node) { c.inner.append(node); scrollThread(c); }
function scrollThread(c) { c.thread.parentElement.scrollTop = c.thread.parentElement.scrollHeight; }

function activityBlock(c, regime) {
  const open = c.inner.querySelector(".activity:not([data-closed])");
  if (open) return open;
  const block = el("div", "activity " + regime);
  push(c, block);
  return block;
}
function fmtArgs(args) {
  return Object.entries(args).map(([k, v]) => `${k}=${typeof v === "string" ? v : JSON.stringify(v)}`).join(", ");
}

async function send(c, text) {
  if (!c.started) { c.started = true; layoutForCurrent(); }
  c.busy = true; syncComposer();
  const regime = regimeClass();
  push(c, el("div", "msg-user", text));
  const thinking = el("div", "thinking"); thinking.append(el("i"), el("i"), el("i"));
  push(c, thinking);
  try {
    const res = await fetch("/api/chat", {
      method: "POST", headers: headers(),
      body: JSON.stringify({ agent: c.agent.key, session: c.session, message: text, mode: state.mode }),
    });
    if (!res.ok) {
      const e = await res.json().catch(() => ({ error: res.statusText }));
      thinking.remove(); push(c, el("div", "sysnote", "Not sent — " + (e.error || res.status))); return;
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buffer.indexOf("\n")) >= 0) {
        const line = buffer.slice(0, idx).trim(); buffer = buffer.slice(idx + 1);
        if (line) handleEvent(c, thinking, regime, JSON.parse(line));
      }
    }
  } catch (err) {
    push(c, el("div", "sysnote", "Connection lost — " + err.message));
  } finally {
    thinking.remove();
    const open = c.inner.querySelector(".activity:not([data-closed])");
    if (open) open.dataset.closed = "1";
    c.busy = false; syncComposer();
  }
}

function handleEvent(c, thinking, regime, ev) {
  switch (ev.type) {
    case "session": c.session = ev.id; break;
    case "assistant": push(c, el("div", "msg-agent interim", ev.text)); break;
    case "tool_call": {
      const block = activityBlock(c, regime);
      const line = el("div", "call"); line.append("▸ ");
      const b = el("b", "", ev.name); line.append(b, `(${fmtArgs(ev.args)})`);
      block.append(line); scrollThread(c); break;
    }
    case "tool_result": {
      const block = activityBlock(c, regime);
      const res = el("div", "res", ev.result);
      if (ev.result.length > 200) { res.classList.add("clamp"); res.title = "Click to expand"; res.addEventListener("click", () => res.classList.toggle("clamp")); }
      block.append(res); scrollThread(c); break;
    }
    case "final": {
      const open = c.inner.querySelector(".activity:not([data-closed])"); if (open) open.dataset.closed = "1";
      push(c, el("div", "msg-agent", ev.text)); break;
    }
    case "error":
    case "turn_limit": { activityBlock(c, regime).append(el("div", "err", ev.message)); break; }
    case "incidents": {
      for (const item of ev.items) {
        const row = el("div", "incident");
        row.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>';
        row.append(el("span", "", item));
        push(c, row);
      }
      c.incidents += ev.items.length;
      c.badge.textContent = String(c.incidents); c.badge.hidden = false;
      push(c, el("div", "sysnote", regime === "gov"
        ? "The tenant let these actions through — review this agent's policy pack in the Xenovia console."
        : "These actions executed with no policy layer. Switch to Governed, reset, and try the same conversation."));
      break;
    }
  }
  if (thinking.isConnected) c.inner.append(thinking);
  scrollThread(c);
}

async function resetThread(c) {
  if (c.session) fetch("/api/reset", { method: "POST", headers: headers(), body: JSON.stringify({ session: c.session }) }).catch(() => {});
  c.session = null; c.started = false; c.incidents = 0;
  c.badge.hidden = true; c.inner.textContent = "";
  if (state.current === c.agent.key) layoutForCurrent();
  input.focus();
}

function submit() {
  const c = state.threads[state.current];
  const text = input.value.trim();
  if (!text || c.busy || !state.roster.modes[state.mode]) return;
  input.value = ""; input.style.height = "auto"; syncComposer();
  send(c, text);
}
sendBtn.addEventListener("click", submit);
input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(); } });
input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 168) + "px";
  syncComposer();
});

init();
</script>
</body>
